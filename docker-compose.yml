version: '3'

x-spark-common: &spark-common
  image: apache/spark:3.5.1-java17-python3
  volumes:
    - ./jobs:/opt/spark/jobs
    - ./landed:/opt/landed
  networks:
    - fda-healthcare

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - airflow.env
  volumes:
    - ./jobs:/opt/airflow/jobs
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./landed:/opt/landed
    - ${HOME}/.snowflake:/opt/airflow/keys:ro
    - ./dbt:/opt/airflow/dbt
  # depends_on:
  #   - postgres
  networks:
    - fda-healthcare

services:
  spark-master:
    <<: *spark-common
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "9090:8080"
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g

  postgres:
    image: postgres:14.0
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - fda-healthcare
  
  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command: 
      - -c
      - |
        set -e
        airflow db migrate
        if ! airflow users list | grep -qw admin; then
          airflow users create \
            --username admin \
            --password admin \
            --firstname bao \
            --lastname ta \
            --role Admin \
            --email baota@example.com
        fi

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  fda-healthcare: